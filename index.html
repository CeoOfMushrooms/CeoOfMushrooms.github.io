<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-family:Arial;text-align:center;padding-top:100px;">

<h1 id="title"></h1>

<div style="width:80%;height:30px;background:#333;margin:auto;border-radius:20px;overflow:hidden;">
  <div id="bar" style="height:100%;background:limegreen;"></div>
</div>

<p id="percent"></p>

<script>
let progress = 0;
let text = "How freaky is Miles?";

document.getElementById("title").innerText = text;
document.getElementById("bar").style.width = progress + "%";
document.getElementById("percent").innerText = progress + "% Complete";
</script>

</body>
</html>
